<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizChat AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>BizChat AI</h2>
        </div>
        <button id="newChatBtn" class="new-chat-btn">+ New Chat</button>
        <div class="chat-history">
            <!-- History items will go here -->
        </div>
        <div class="sidebar-footer">
            <button id="settingsBtn">⚙️ Settings</button>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-content">
        <div class="chat-container" id="chatContainer">
            <!-- Welcome Screen (Empty State) -->
            <div class="welcome-screen" id="welcomeScreen">
                <h1>Good Evening, Faiza</h1>
                <p>How can BizChat AI help you today?</p>
                <div class="suggestion-cards">
                    <div class="card" onclick="useSuggestion('Draft a professional email to a client.')">
                        ✍️ Draft an Email
                    </div>
                    <div class="card" onclick="useSuggestion('Summarize this text into 5 bullet points: ')">
                        📄 Summarize Report
                    </div>
                    <div class="card" onclick="useSuggestion('Give me 5 business ideas for a small startup.')">
                        💡 Business Ideas
                    </div>
                    <div class="card" onclick="useSuggestion('Explain this code concept in simple terms: ')">
                        💻 Code Help
                    </div>
                </div>
            </div>
            
            <!-- Chat Messages -->
            <div id="messagesArea"></div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <textarea id="userInput" placeholder="Type your message here..." rows="1"></textarea>
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="setting-item">
                <label>Theme</label>
                <select id="themeSelect">
                    <option value="dark">Dark Mode</option>
                    <option value="light">Light Mode</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Chat Background</label>
                <select id="bgSelect">
                    <option value="default">Default</option>
                    <option value="gradient">Blue Gradient</option>
                    <option value="dark-pure">Pure Black</option>
                    <option value="light-pure">Pure White</option>
                </select>
            </div>
            <button id="saveSettingsBtn" class="save-btn">Save Settings</button>
            <button id="closeModalBtn" class="close-btn">Close</button>
        </div>
    </div>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
